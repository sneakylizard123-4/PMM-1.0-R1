; PlatformIO Project Configuration
; PMM-1.0-R1 Power Management Module Firmware
; MCU: STM32C031C4T6 (Cortex-M0+, 32KB Flash, 12KB SRAM, 48MHz HSI)

[env:stm32c031c4]
platform = ststm32
board = stm32c031c4
framework = stm32cube

; Upload via ST-Link
upload_protocol = stlink
upload_port = stlink

; Debug via ST-Link
debug_tool = stlink

; Build flags
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32C031xx
    -DCORE_CM0PLUS
    -DSTM32C0
    -DHSE_VALUE=0
    -DHSI_VALUE=48000000
    -DSYSCLK_FREQ=48000000
    -Isrc
    -Wall
    -Wextra

; Build type
build_type = release

; Monitor speed (UART debug)
monitor_speed = 115200
monitor_port = /dev/ttyACM0
